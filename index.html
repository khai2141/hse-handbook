<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>건설안전 HSE 핸드북</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <div class="head">
    <div class="brand"><b>건설안전 HSE 핸드북</b><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button type="button" class="menu" id="menu" aria-expanded="false" aria-controls="outline">트리 보기</button><input id="q" type="search" placeholder="표 안에서 검색 (예: 일용, ㅌㅅㅎㅌ)" aria-label="표 검색" autocomplete="off"></span></div>
    <div class="crumbs" id="crumbs"></div>
  </div>
  <p class="demo">시간·과태료는 law.go.kr 원문 확인값(2026-11-03)이며 법 조문 일부는 시행일이 2027-04-28로 표시되어 현행본 대조 전입니다. 노란 칸은 원문 미확인, 붉은 칸은 아직 조회하지 못한 항목입니다. <b>표의 칸(ⓘ가 아닌 칸)을 누르면 그 칸의 내용만 열립니다.</b></p>
  <div class="layout">
    <nav class="outline" id="outline" aria-label="나무 구조"></nav>
    <main class="main" id="main"><noscript>이 핸드북은 자바스크립트가 필요합니다.</noscript></main>
  </div>
</div>
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
