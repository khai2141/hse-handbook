  <details class="demo"><summary>출처와 읽는 법</summary><p>조문 원문은 law.go.kr에서 가져온 현행 시행본이며 전 조문을 2026-11-07에 다시 대조했습니다. 시간·과태료는 시행규칙 별표 4·시행령 별표 35 기준입니다. 노란 칸은 원문 미확인, 붉은 칸은 아직 조회하지 못한 항목입니다. 표의 줄이나 칸(ⓘ가 아닌 칸)을 누르면 상세가 열립니다. 법 일부 조문은 2027-04-28 시행 예정 개정이 있습니다(&lsquo;법 개정 반영&rsquo; 가지).</p></details>
